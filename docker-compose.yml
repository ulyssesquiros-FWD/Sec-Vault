services:
  mysql:
    image: mysql:8.4
    container_name: securevault-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-securevault}
      MYSQL_USER: ${DB_USER:-securevault_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      # Ligado exclusivamente a loopback local; nunca exponer MySQL públicamente
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - secvault_internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securevault-migrate
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_SSL: ${DB_SSL:-false}
      APP_URL: ${APP_URL:-http://localhost:4000}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:4000}
    command: ["node", "src/database/migrate.js"]
    networks:
      - secvault_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securevault-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_SSL: ${DB_SSL:-false}
      APP_URL: ${APP_URL:-http://localhost:4000}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:4000}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - secvault_internal

networks:
  secvault_internal:
    driver: bridge

volumes:
  mysql_data:
