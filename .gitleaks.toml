title = "SecureVault Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "securevault-encryption-key-hex"
description = "Detecta llaves AES-256-GCM de 64 caracteres hexadecimales expuestas en el repositorio"
regex = '''(?i)(DATA_ENCRYPTION_KEY|DATA_ENCRYPTION_PREVIOUS_KEYS)\s*[:=]\s*['"]?(?:v\d+:)?[0-9a-f]{64}['"]?'''
keywords = ["DATA_ENCRYPTION_KEY", "DATA_ENCRYPTION_PREVIOUS_KEYS"]

[[rules]]
id = "securevault-session-secret"
description = "Detecta SESSION_SECRET no vacío expuesto fuera de plantillas"
regex = '''(?i)SESSION_SECRET\s*[:=]\s*['"]?[A-Za-z0-9!@#$%^&*()_+\-=]{16,}['"]?'''
keywords = ["SESSION_SECRET"]

[allowlist]
description = "Permite pruebas sintéticas efímeras y plantillas sin secretos"
paths = [
  '''^\.env\.example$''',
  '''^backend/tests/'''
]
