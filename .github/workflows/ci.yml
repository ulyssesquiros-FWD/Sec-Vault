name: SecureVault CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: 1. Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks CLI oficial (v8.30.1)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f /tmp/gitleaks.tar.gz
          gitleaks version

      - name: Ejecutar Gitleaks sobre todo el historial Git
        run: |
          gitleaks git . --config .gitleaks.toml --redact --verbose

  backend-tests:
    name: 2. Backend Unit & OWASP HTTP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias reproducibles (npm ci)
        working-directory: backend
        run: npm ci

      - name: Ejecutar pruebas unitarias y de seguridad OWASP
        working-directory: backend
        run: npm test

  mysql-integration-tests:
    name: 3. MySQL 8.4 Integration Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_ephemeral_root_pw_84 # gitleaks:allow
          MYSQL_DATABASE: securevault_test
          MYSQL_USER: securevault_test
          MYSQL_PASSWORD: ci_ephemeral_app_pw_84 # gitleaks:allow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_ephemeral_root_pw_84"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias reproducibles (npm ci)
        working-directory: backend
        run: npm ci

      - name: Ejecutar migraciones SQL versionadas sobre MySQL 8.4
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: securevault_test
          DB_USER: securevault_test
          DB_PASSWORD: ci_ephemeral_app_pw_84 # gitleaks:allow
          DB_SSL: 'false'
          SESSION_SECRET: ci_ephemeral_session_secret_32_characters_long # gitleaks:allow
          DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef # gitleaks:allow
        run: npm run db:migrate

      - name: Ejecutar suite completa de integración MySQL real (falla si MySQL no responde)
        working-directory: backend
        env:
          REQUIRE_MYSQL: 'true'
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: securevault_test
          TEST_DB_USER: securevault_test
          TEST_DB_PASSWORD: ci_ephemeral_app_pw_84 # gitleaks:allow
          TEST_DB_SSL: 'false'
        run: npm run test:integration

  npm-audit:
    name: 4. Dependency Security Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar y auditar backend (bloquea si hay High/Critical)
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Instalar y auditar frontend (bloquea si hay High/Critical)
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  frontend-tests:
    name: 5. Frontend React Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias reproducibles (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Ejecutar pruebas Vitest y anti-XSS
        working-directory: frontend
        run: npm test

  frontend-build:
    name: 6. Frontend Production Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias reproducibles (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Compilar artefacto de producción Vite
        working-directory: frontend
        run: npm run build

  deploy:
    name: 7. Despliegue Condicionado a Todas las Verificaciones
    needs:
      - secret-scan
      - backend-tests
      - mysql-integration-tests
      - npm-audit
      - frontend-tests
      - frontend-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar webhook de despliegue si está configurado en GitHub Secrets
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL no configurado en GitHub Secrets. Despliegue automático omitido."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
          echo "Despliegue disparado correctamente tras aprobar los 6 trabajos de verificación."
